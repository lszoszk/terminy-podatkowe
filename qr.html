<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zeskanuj</title>
<style>
  body { margin:0; min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; background:#fff; color:#111; font:20px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-align:center; padding:16px; box-sizing:border-box; }
  #qr { padding:16px; background:#fff; }
  #qr img, #qr canvas { width:min(70vh, 85vw) !important; height:auto !important; image-rendering:pixelated; }
  .url { font-size:clamp(18px, 3vw, 34px); font-weight:600; margin-top:12px; word-break:break-all; }
</style>
</head>
<body>
  <div id="qr"></div>
  <div class="url" id="url"></div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script>
    const url = location.href.replace(/qr\.html.*$/, "");
    document.getElementById("url").textContent = url.replace(/^https?:\/\//, "");
    new QRCode(document.getElementById("qr"), { text:url, width:512, height:512, correctLevel:QRCode.CorrectLevel.M });
  </script>
</body>
</html>
